<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCP-Drive</title>
<link rel="icon" href="gcp-drive.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="gcp-drive.svg" alt=""><span>GCP-Drive</span></div>
    <form id="search-form" class="search" role="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Pesquisar no Google Drive" aria-label="Pesquisar no Google Drive"></form>
    <button id="pause" class="round" title="Pausar sincronização" aria-label="Pausar sincronização"><span data-icon="pause"></span></button>
    <div class="menu-wrap">
      <button id="more" class="round" title="Mais opções" aria-label="Mais opções" aria-haspopup="menu" aria-expanded="false"><span data-icon="gear"></span></button>
      <div id="menu" class="menu" role="menu" hidden>
        <button role="menuitem" data-page="preferences">Preferências</button>
        <button role="menuitem" data-page="storage">Espaço usado</button>
        <button role="menuitem" data-page="notifications">Lista de erros</button>
        <button role="menuitem" data-page="about">Sobre</button>
        <button role="menuitem" id="menu-support">Apoie o projeto</button>
      </div>
    </div>
    <button id="gemini" class="round" title="Gemini no Google Drive" aria-label="Gemini no Google Drive"><span data-icon="star"></span></button>
    <button id="account" class="account"><span data-icon="person"></span><span id="account-name">Contas</span></button>
  </header>
  <div class="body">
    <nav class="rail" aria-label="Seções">
      <button id="open-drive" class="open-drive"><span data-icon="folder"></span>Abrir pasta do Drive</button>
      <button class="nav" data-page="home"><span data-icon="home"></span>Início</button>
      <button class="nav" data-page="activity"><span data-icon="refresh"></span>Atividade</button>
      <button class="nav" data-page="notifications"><span data-icon="bulb"></span>Notificações</button>
    </nav>
    <main id="surface" aria-live="polite"></main>
  </div>
</div>
<p id="notice" class="notice" role="status" hidden></p>
<input id="registration-file" type="file" accept=".json,application/json" hidden>
<input id="upload-file" type="file" hidden>
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text" class="muted"></p>
    <div class="dialog-actions"><button value="no" class="pill small">Cancelar</button><button value="yes" class="primary small" id="confirm-yes">Continuar</button></div>
  </form>
</dialog>
<dialog id="support">
  <h2>Apoie o projeto</h2>
  <button class="author" data-browse="https://gestaoculturalpro.com.br/">Desenvolvido por Bruno Albertini · Gestão Cultural Pro</button>
  <div class="support">
    <div class="support-card">
      <h3>PIX · Brasil</h3>
      <img src="support-pix.png" alt="QR Code PIX · Brasil">
      <span class="muted">Escaneie com o aplicativo do seu banco.</span>
      <button class="primary small" id="copy-pix">Copiar PIX</button>
      <details><summary>Ver código PIX</summary><code id="pix-code"></code></details>
    </div>
    <div class="support-card">
      <h3>Stripe · Internacional</h3>
      <img src="support-stripe.png" alt="QR Code Stripe · Internacional">
      <span class="muted">Escaneie com a câmera do celular.</span>
      <button class="link" id="open-stripe">Contribuir via Stripe</button>
      <button class="link" id="copy-stripe">Copiar link do Stripe</button>
    </div>
  </div>
  <p class="muted">O apoio é voluntário.</p>
  <form method="dialog" class="dialog-actions"><button class="pill small">Fechar</button></form>
</dialog>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
