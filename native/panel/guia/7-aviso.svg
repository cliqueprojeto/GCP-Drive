<text x="60" y="84" fill="#1d1b26" font-weight="700" font-size="17">O Google não verificou este app</text><text x="60" y="110" fill="#686478" font-weight="400" font-size="13">O app está solicitando acesso a informações da sua Conta do Google.</text><text x="60" y="128" fill="#686478" font-weight="400" font-size="13">Aparece porque o cadastro é seu e não passou pela verificação paga do Google.</text><text x="60" y="170" fill="#6a3de8" font-weight="600" font-size="13">Avançado</text><rect x="51" y="149" width="80" height="34" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="51" cy="149" r="11" fill="#e0457b"/><text x="51" y="153.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="60" y="214" fill="#6a3de8" font-weight="600" font-size="13">Acessar GCP-Drive (não seguro)</text><rect x="51" y="193" width="220" height="34" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="51" cy="193" r="11" fill="#e0457b"/><text x="51" y="197.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="470" y="236" width="130" height="30" rx="7" fill="#ffffff" stroke="#c9c4da"/><text x="482" y="256.0" fill="#1d1b26" font-weight="600" font-size="13">Voltar à segurança</text>
