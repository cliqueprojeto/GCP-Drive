name: Native engine (Windows)
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Anexar o instalador a um rascunho de versão não publicado
        type: boolean
        default: false
permissions:
  # Writing is used only to attach the installer to a draft release, when asked.
  contents: write
jobs:
  test:
    name: Cloud Files integration
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Cloud Files filter driver
        run: |
          cmd /c ver
          sc.exe query cldflt
          exit 0
      - run: go vet ./...
      - run: go test -count=1 -v ./...
      # A temporary sync root served from memory. It does not establish behaviour in the Explorer or with a Google account.
      - name: Build the service and its installer
        run: |
          if (Get-Command windres -ErrorAction SilentlyContinue) { windres -O coff -o rsrc_windows_amd64.syso windows/app.rc }
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o windows/build/gcp-drive.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = (Select-String -Path account.go -Pattern 'const version = "(.*)"').Matches[0].Groups[1].Value
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          & $nsis /INPUTCHARSET UTF8 "/DVERSION=$version" windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-FileHash windows\build\GCP-Drive-*-instalador.exe -Algorithm SHA256 | Format-List
      # Silent install, upgrade and uninstall on the runner, without accounts. The installer carries no Google registration.
      - name: Install, upgrade and uninstall
        run: windows\test-installer.ps1
      - uses: actions/upload-artifact@v4
        # The account's artifact storage may be full; the checks above do not depend on the upload.
        continue-on-error: true
        with:
          name: gcp-drive-windows-installer
          path: native/windows/build/GCP-Drive-*-instalador.exe
          retention-days: 14
          if-no-files-found: error
      # A draft is visible only to who can write to the repository; nothing is published.
      - name: Attach the installer to a draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = (Get-ChildItem windows\build\GCP-Drive-*-instalador.exe | Select-Object -First 1).FullName
          gh release view windows-teste --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-teste --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "GCP-Drive para Windows - rascunho de teste" --notes "Instalador de teste gerado pelo workflow Native engine (Windows). Não foi homologado numa área de trabalho do Windows; veja docs/VALIDACAO.md. Não traz cadastro do Google."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload windows-teste $file --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
