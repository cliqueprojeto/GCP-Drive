name: Test packages
on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Stage installers on an existing draft prerelease instead of storing Actions artifacts
        required: false
        type: string
permissions:
  contents: write
jobs:
  package:
    name: Package (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: node node_modules/electron-builder/cli.js --win nsis --x64 --publish never
          - name: linux-x64
            os: ubuntu-22.04
            command: node node_modules/electron-builder/cli.js --linux deb rpm AppImage --x64 --publish never
          - name: macos-x64
            os: macos-15-intel
            command: node node_modules/electron-builder/cli.js --mac dmg --x64 --publish never
          - name: macos-arm64
            os: macos-15
            command: node node_modules/electron-builder/cli.js --mac dmg --arm64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run prepare:rclone
      - name: Verify optional Windows prerequisite
        if: runner.os == 'Windows'
        run: npm run prepare:winfsp
      - name: Install RPM build tool in disposable runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:engine
      - run: node scripts/sync-smoke.mjs
      - run: npm run build
      - name: Windows desktop authorization and disconnect regressions
        if: runner.os == 'Windows'
        run: |
          node scripts/auth-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/disconnect-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ${{ matrix.command }}
      - run: node scripts/package-checksums.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.draft_tag == ''
        with:
          name: gcp-drive-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.AppImage
            release/SHA256SUMS
            release/LEIA-ME-TESTES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Stage checksummed packages on the matching draft
        if: inputs.draft_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          GROUP: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$DRAFT_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(gh release view "$DRAFT_TAG" --json isDraft,isPrerelease,targetCommitish --jq '[.isDraft,.isPrerelease,.targetCommitish] | join(" ")')" = "true true $GITHUB_SHA"
          cd release
          if command -v sha256sum >/dev/null; then sha256sum --check SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          mv SHA256SUMS "SHA256SUMS-$GROUP"
          shopt -s nullglob
          packages=(*.exe *.deb *.rpm *.dmg *.AppImage)
          test "${#packages[@]}" -gt 0
          if [[ "$GROUP" == windows-x64 ]]; then packages+=(LEIA-ME-TESTES.txt); fi
          gh release upload "$DRAFT_TAG" "${packages[@]}" "SHA256SUMS-$GROUP" --clobber
      # Staging only: publication requires independent verification of all packages.
